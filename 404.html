<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Family Planner</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // Encodes the full path into the query string and redirects to index.html
      // so the app can boot from any URL without a real 404.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body>Loading Family Planner…</body>
</html>
