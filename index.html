    <script>
      // Companion to public/404.html — restores the path from ?p= after a
      // GitHub Pages 404 redirect so the app boots at the correct URL.
      (function() {
        var p = window.location.search.slice(1).split('&')
          .find(function(s) { return s.startsWith('p='); });
        if (p) {
          var decoded = '/' + decodeURIComponent(p.slice(2));
          window.history.replaceState(null, null, decoded || '/');
        }
      })();
    </script>
