<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#E0D9FF;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6584;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9A6C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6C63FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- House body -->
  <rect x="128" y="240" width="256" height="190" rx="12" fill="url(#houseGrad)"/>

  <!-- Roof -->
  <polygon points="96,252 256,96 416,252" fill="url(#roofGrad)"/>
  <polygon points="96,252 112,252 256,112 400,252 416,252 256,96" fill="url(#roofGrad)"/>

  <!-- Door -->
  <rect x="216" y="330" width="80" height="100" rx="40" fill="url(#bgGrad)" opacity="0.7"/>
  <circle cx="286" cy="385" r="6" fill="white" opacity="0.9"/>

  <!-- Left window with calendar grid -->
  <rect x="148" y="265" width="80" height="64" rx="8" fill="url(#calGrad)" opacity="0.85"/>
  <!-- Calendar lines -->
  <line x1="168" y1="278" x2="208" y2="278" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="290" x2="228" y2="290" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <circle cx="165" cy="305" r="5" fill="white" opacity="0.9"/>
  <circle cx="183" cy="305" r="5" fill="white" opacity="0.5"/>
  <circle cx="201" cy="305" r="5" fill="white" opacity="0.9"/>
  <circle cx="219" cy="305" r="5" fill="white" opacity="0.5"/>
  <circle cx="165" cy="320" r="5" fill="white" opacity="0.5"/>
  <circle cx="183" cy="320" r="5" fill="white" opacity="0.9"/>
  <circle cx="201" cy="320" r="5" fill="white" opacity="0.5"/>
  <circle cx="219" cy="320" r="5" fill="white" opacity="0.9"/>

  <!-- Right window with check marks -->
  <rect x="284" y="265" width="80" height="64" rx="8" fill="#6EE7B7" opacity="0.85"/>
  <polyline points="296,292 305,302 320,282" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="296" y1="315" x2="352" y2="315" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="296" y1="325" x2="340" y2="325" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Chimney -->
  <rect x="320" y="130" width="36" height="70" rx="6" fill="url(#roofGrad)"/>

  <!-- Smoke puffs -->
  <circle cx="338" cy="118" r="10" fill="white" opacity="0.4"/>
  <circle cx="326" cy="106" r="8" fill="white" opacity="0.25"/>
  <circle cx="344" cy="98" r="6" fill="white" opacity="0.15"/>
</svg>
